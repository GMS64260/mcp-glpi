# Publishes the package to npm when a GitHub release is published.
#
# Authentication: npm trusted publishing (OIDC), no token stored in GitHub.
# Setup (package owner, once, on npmjs.com):
#   mcp-glpi > Settings > Trusted Publisher > GitHub Actions
#     Organization or user: GMS64260
#     Repository:           mcp-glpi
#     Workflow filename:    publish.yml
#     Environment:          (empty)
# Trusted publishing needs npm >= 11.5.1, hence Node 24 below. Provenance is
# generated automatically for a public repository.
#
# The release tag must match package.json "version" (v4.1.0 <-> 4.1.0).
# When that version is already on npm (published by hand with `npm publish`),
# the job stops there and succeeds instead of failing on a 403.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag against package.json and the registry
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
          if npm view "mcp-glpi@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::mcp-glpi@$VERSION is already on npm, nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Node 24 ships npm 11; make sure it is recent enough for OIDC.
      - if: steps.check.outputs.skip != 'true'
        run: npm install -g npm@^11.5.1
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      # prepublishOnly runs build + lint + test before the upload.
      - if: steps.check.outputs.skip != 'true'
        run: npm publish --access public
